        @keyframes glitchFlash {

        /* タイトルのランダム・テキストグリッチ */
        @keyframes textGlitch {
            0% { transform: translate(0); filter: none; }
            20% { transform: translate(-1px, 1px); filter: contrast(200%); }
            40% { transform: translate(-2px, -1px); filter: blur(0.5px); }
            60% { transform: translate(1px, 1px); filter: none; }

    <script>
        // --- 深夜変貌モードの判定 (0時〜4時) ---
        const currentHour = new Date().getHours();
        const isMidnight = currentHour >= 0 && currentHour < 4;

        if (isMidnight) {
            document.body.classList.add('midnight-mode');
            
            const titles = ["Hogeshy [3:03 AM]", "Hogeshy [WITCHING HOUR]", "Hog...sh..."];
            document.getElementById('title-text').textContent = titles[Math.floor(Math.random() * titles.length)];
            document.getElementById('copyright-text').textContent = "© Hogeshy // THE VEIL IS THIN";

            window.addEventListener('load', () => {
                setTimeout(() => {
                    document.body.classList.add('glitching');
                }, 800);

                setTimeout(spawnMassivePawPrints, 1200);
                setTimeout(spawnMassivePawPrints, 3200);
            });
        }

        // --- 1. ランダム・テキストグリッチ（不意に文字が歪む） ---
        const titleSpan = document.getElementById('title-text');
        const originalTitleText = titleSpan.textContent;

        function triggerTextGlitch() {
            const glitchChars = ['#', '3', '%', 'x', '7', '_', 'sh', '0', '~'];
            if (Math.random() > 0.4) {
                titleSpan.classList.add('glitching-active');
                if (Math.random() > 0.5) {
                    titleSpan.textContent = "H0g3sh" + glitchChars[Math.floor(Math.random() * glitchChars.length)];
                }
                setTimeout(() => {
                    titleSpan.classList.remove('glitching-active');
                    titleSpan.textContent = originalTitleText;
                }, Math.random() * 250 + 100);
            }
            setTimeout(triggerTextGlitch, Math.random() * 4000 + 2000);
        }
        setTimeout(triggerTextGlitch, 2000);


        // --- 2. タップ・マウス軌跡のノイズ粒子（スマホ・iPad・PC完全対応） ---
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'touch-particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.7) {
                createParticle(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch && Math.random() > 0.5) {
                createParticle(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch) {
                for (let i = 0; i < 2; i++) {
                    createParticle(touch.clientX + (Math.random() * 20 - 10), touch.clientY + (Math.random() * 20 - 10));
                }
            }
        }, { passive: true });


        function spawnMassivePawPrints() {
            for (let route = 0; route < 3; route++) {
                setTimeout(() => {
                    let x = Math.random() * (window.innerWidth - 200) + 100;
                    let y = Math.random() * (window.innerHeight - 200) + 100;

                    for (let i = 0; i < 12; i++) {
                        setTimeout(() => {
                            const paw = document.createElement('div');
                            paw.className = 'paw-print';
                            
                            x += (Math.random() * 120 - 60);
                            y += (Math.random() * 90 - 45);

                            if (x < 10) x = 30;
                            if (x > window.innerWidth - 10) x = window.innerWidth - 30;
                            if (y < 10) y = 30;
                            if (y > window.innerHeight - 10) y = window.innerHeight - 30;

                            paw.style.left = x + 'px';
                            paw.style.top = y + 'px';
                            document.body.appendChild(paw);
                            
                            setTimeout(() => paw.remove(), 4500);
                        }, i * 120);
                    }
                }, route * 600);
            }
        }

        // --- イースターエッグ ---
        let clickCount = 0;
        const targetImg = document.getElementById('easter-egg-target');
        const flavorText = document.getElementById('flavor-text');

        targetImg.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 5) {
                flavorText.style.color = isMidnight ? "#ff9999" : "#fff";
                flavorText.innerHTML = 
                    "ACCESS DETECTED.<br>Coordinates: 33.8833° N, 130.8833° E<br>" + 
                    (isMidnight ? "WITCHING HOUR ACTIVE. DO NOT LOOK BEHIND YOU." : "Everything is transient.");
                setTimeout(() => {
                    clickCount = 0;
                }, 6000);
            }
        });
    </script>


<script>
(() => {
  const nav = document.querySelector('.site-nav');
  const toggle = document.querySelector('.nav-toggle');
  if (!nav || !toggle) return;
  const close = () => {
    nav.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  };
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  nav.querySelectorAll('.nav-links a').forEach(link => link.addEventListener('click', close));
  document.addEventListener('click', event => { if (!nav.contains(event.target)) close(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
})();
</script>

<script src="shared-nav.js"></script>
</body>
