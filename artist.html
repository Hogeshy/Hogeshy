    .contact-link {
      display: inline-block;

        <p class="intro">Hogeshyをつくっている人。<br>猫が好きです。<br><br>猫のように、何もしない時間も好きです。<br>頑張ることにも、癒やされることにもちょっと疲れたとき、<br><br>何もしなくていい時間を一緒に過ごせるものを、<br><br>絵や物語、日記、音楽にしています。<br>Hogeshyは、仕事を休んでいた頃に生まれました。<br><br>空っぽな気持ちや、身体から力が抜けたような感覚を、<br><br>大好きな猫の姿に重ねました。<br>答えを出すためではなく、<br><br>ただ静かにそばにいるために。</p>
