<h1>Free</h1><p class="intro">Small things Hogeshy left behind.<br>Free phone wallpapers and icons. Take one if you want.</p><div class="free-grid"><a class="free-card" href="wallpapers.html"><strong>WALLPAPERS</strong><span>Dark screens for quiet nights. Tap an image to download.</span></a><a class="free-card" href="icons.html"><strong>ICONS</strong><span>Small circular faces for wherever you decide to place them.</span></a></div><a class="back" href="index.html">&larr; RETURN TO START</a></main>
<script>
(() => {
  const nav = document.querySelector('.site-nav');
  const toggle = document.querySelector('.nav-toggle');
  if (!nav || !toggle) return;
  const close = () => {
    nav.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  };
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  nav.querySelectorAll('.nav-links a').forEach(link => link.addEventListener('click', close));
  document.addEventListener('click', event => { if (!nav.contains(event.target)) close(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
})();
</script>
