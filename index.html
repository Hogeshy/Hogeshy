<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogeshy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 環境音スイッチ（最初からONの見た目） */
        .ambient-control {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.65rem;
            color: #fff;
            background: transparent;
            border: 1px solid #666;
            padding: 6px 10px;
            cursor: pointer;
            letter-spacing: 0.15em;
            transition: all 0.3s;
        }

        .ambient-control:hover {
            border-color: #fff;
        }

        .container {
            text-align: center;
            max-width: 440px;
            padding: 20px;
            width: 100%;
        }

        /* 奇妙に揺らぎながら現れるアニメーション */
        @keyframes strangeAppear {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
                filter: blur(6px);
            }
            40% {
                opacity: 0.4;
                transform: translateY(-3px) scale(1.01);
                filter: blur(2px);
            }
            70% {
                opacity: 0.8;
                transform: translateY(1px) scale(1);
                filter: blur(0.5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .image-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(120%);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #fff;
            margin-bottom: 12px;
            text-transform: uppercase;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
            opacity: 0;
        }

        .flavor-text {
            font-size: 0.8rem;
            color: #777;
            line-height: 1.7;
            margin-bottom: 28px;
            letter-spacing: 0.05em;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
        }

        .btn {
            display: block;
            padding: 12px 0;
            background: transparent;
            color: #ccc;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn.disabled {
            color: #444;
            border-color: #1a1a1a;
            cursor: default;
            pointer-events: none;
        }

        /* 匿名メッセージ */
        .guestbook {
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
            font-size: 0.7rem;
            color: #555;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
        }

        .guestbook input {
            background: #0a0a0a;
            border: 1px solid #222;
            color: #aaa;
            padding: 6px;
            font-family: inherit;
            font-size: 0.7rem;
            width: 70%;
            margin-right: 5px;
            outline: none;
        }

        .guestbook button {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .guestbook button:hover {
            color: #fff;
            border-color: #666;
        }

        .log-list {
            margin-top: 10px;
            color: #444;
            font-size: 0.65rem;
            min-height: 20px;
            letter-spacing: 0.1em;
        }

        /* コピーライト表記 */
        .copyright {
            margin-top: 20px;
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <button class="ambient-control" id="sound-btn">SOUND: ON</button>

    <div class="container">
        <div class="image-wrapper" id="easter-egg-target" title="...?">
            <img src="Hogeshy.png" alt="Hogeshy">
        </div>

        <h1>Hogeshy</h1>
        <div class="flavor-text" id="flavor-text">
            Hoge × Munashy = Hogeshy<br>
            Eats nothingness, eats canned cat food, and thinks about nothing.<br>
            But, probably happy.
        </div>

        <div class="links">
            <a href="wallpapers.html" class="btn">WALLPAPERS</a>
            <a href="icons.html" class="btn">ICONS</a>
            <a href="gallery.html" class="btn">GALLERY</a>
            <a href="#" class="btn disabled">LINE STAMP (COMING SOON)</a>
            <a href="https://www.instagram.com/hogeshy_ai/" class="btn" target="_blank">INSTAGRAM</a>
        </div>

        <div class="guestbook">
            <div style="margin-bottom: 6px; letter-spacing: 0.1em;">Leave a trace...</div>
            <form id="trace-form">
                <input type="text" id="trace-input" placeholder="..." maxlength="20" autocomplete="off">
                <button type="submit">SEND</button>
            </form>
            <div class="log-list" id="log-list">...</div>
            <div class="copyright">&copy; Hogeshy</div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = true; // 最初からONの状態として扱う
        let noiseNode = null;
        let gainNode = null;

        function startAmbientSound() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 250;

            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.04;

            noiseNode.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        // ページ読み込み時に自動再生をトライ（ブロックされた場合は最初のクリックで解除）
        window.addEventListener('load', () => {
            try {
                startAmbientSound();
            } catch(e) {
                // ブロックされた場合は初回クリックに備える
            }
        });

        // ユーザーが最初に画面のどこかを触った瞬間に音をアンロックして鳴らす
        document.body.addEventListener('click', function unlockAudio() {
            if (isPlaying && (!audioCtx || audioCtx.state === 'suspended')) {
                startAmbientSound();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        }, { once: true });

        // サウンドボタンの手動切り替え
        document.getElementById('sound-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPlaying) {
                if (noiseNode) {
                    noiseNode.stop();
                    noiseNode.disconnect();
                }
                if (audioCtx) {
                    audioCtx.close();
                    audioCtx = null;
                }
                isPlaying = false;
                this.textContent = "SOUND: OFF";
                this.style.borderColor = "#222";
                this.style.color = "#555";
            } else {
                startAmbientSound();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                isPlaying = true;
                this.textContent = "SOUND: ON";
                this.style.borderColor = "#666";
                this.style.color = "#fff";
            }
        });

        // イースターエッグ
        let clickCount = 0;
        const targetImg = document.getElementById('easter-egg-target');
        const flavorText = document.getElementById('flavor-text');

        targetImg.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 5) {
                flavorText.style.color = "#fff";
                flavorText.innerHTML = 
                    "ACCESS DETECTED.<br>Coordinates: 33.8833° N, 130.8833° E<br>Everything is transient.";
                setTimeout(() => {
                    clickCount = 0;
                }, 6000);
            }
        });

        // 多彩なランダム足跡
        const traceForm = document.getElementById('trace-form');
        const traceInput = document.getElementById('trace-input');
        const logList = document.getElementById('log-list');

        const initialTraces = [
            "Midnight echo...", 
            "Nothing here.", 
            "Cold floor.", 
            "A cat meowed somewhere.", 
            "Just passing through.",
            "Darkness is quiet.",
            "Can't sleep.",
            "Canned food was delicious.",
            "Where is this?",
            "3:42 AM.",
            "Staring at the screen.",
            "Void."
        ];
        let currentTrace = initialTraces[Math.floor(Math.random() * initialTraces.length)];
        logList.textContent = `> "${currentTrace}"`;

        traceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = traceInput.value.trim();
            if (val) {
                logList.textContent = `> "${val}"`;
                traceInput.value = "";
            }
        });
    </script>

</body>
</html>
