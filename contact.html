<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hogeshy-お問い合わせ</title>
  <meta name="description" content="Hogeshyへのお問い合わせ。作品の利用や制作についてのご相談を受け付けています。">
  <meta name="theme-color" content="#071018">
  <link rel="canonical" href="https://hogeshy.com/contact.html">
  <link rel="stylesheet" href="mirror-theme.css">
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; padding:40px 20px; background:#071018; color:#d8e4e2; font-family:'Courier New',monospace; }
    .page { max-width:760px; margin:0 auto; }
    .contact-header { padding:64px 0 42px; border-bottom:1px solid rgba(155,188,197,.22); }
    .eyebrow { color:#a8c4c9; font-size:.66rem; letter-spacing:.2em; }
    h1 { margin:16px 0 18px; color:#e6efed; font-family:Georgia,serif; font-size:clamp(2.2rem,6vw,4rem); font-weight:normal; letter-spacing:.02em; line-height:1.25; }
    .lead { max-width:560px; margin:0; color:#8ca1a7; font-size:.86rem; line-height:2; }
    .contact-card { margin:34px 0 24px; padding:30px 26px; border:1px solid rgba(155,188,197,.22); background:rgba(10,25,32,.58); }
    .contact-card h2 { margin:0 0 18px; color:#c4dce4; font-size:.78rem; font-weight:normal; letter-spacing:.16em; }
    .contact-card p { margin:0 0 22px; color:#8ca1a7; font-size:.8rem; line-height:2; }
    .email-link { display:inline-block; padding:14px 18px; border:1px solid rgba(155,188,197,.3); color:#d8e4e2; text-decoration:none; font-size:.78rem; letter-spacing:.06em; transition:background .2s ease,border-color .2s ease; }
    .email-link:hover,.email-link:focus-visible { border-color:#a8c4c9; background:rgba(65,108,122,.15); outline:none; }
    .notes { color:#718991; font-size:.7rem; line-height:1.9; }
    .back { display:inline-block; margin-top:28px; color:#8ca1a7; text-decoration:none; font-size:.68rem; letter-spacing:.12em; }
    .back:hover,.back:focus-visible { color:#e6efed; }
    @media(max-width:640px){ body{padding:24px 16px;} .contact-header{padding:44px 0 32px;} .contact-card{padding:24px 20px;} }
  </style>
</head>
<body>
  <main class="page">
    <nav class="site-nav" aria-label="主要メニュー"></nav>
    <header class="contact-header">
      <div class="eyebrow">お問い合わせ</div>
      <h1>お問い合わせ</h1>
      <p class="lead">Hogeshyについてのご質問、作品の利用、制作やお仕事のご相談などがありましたら、こちらからご連絡ください。</p>
    </header>
    <section class="contact-card" aria-labelledby="contact-mail-title">
      <h2 id="contact-mail-title">メールでお問い合わせ</h2>
      <p>迷惑メール対策のため、メールアドレスは一部を置き換えて表示しています。</p>
      <p class="email-link">info アット hogeshy ドット com<br><small>送信前に、「アット」を「@」、「ドット」を「.」へ必ず置き換えてください。</small></p>
    </section>
    <p class="notes">お問い合わせの内容によっては、返信までに数日いただく場合があります。営業目的のご連絡には返信できないことがあります。お預かりしたメールアドレスは、お問い合わせへの返信以外の目的では使用しません。</p>
    <a class="back" href="index.html">← ホームへ戻る</a>
  </main>
  <script src="shared-nav.js"></script>
</body>
</html>
