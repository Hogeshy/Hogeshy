<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogeshy Diary Archive</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #888;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 60px;
            display: block;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        h1 {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #444;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .archive-layout {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        @media (min-width: 600px) {
            .archive-layout {
                flex-direction: row;
                gap: 80px;
            }
        }
        /* 左側：日付の羅列 */
        .date-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .date-item {
            cursor: pointer;
            color: #555;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .date-item:hover {
            color: #aaa;
        }
        .date-item.active {
            color: #fff;
            text-decoration: underline;
        }
        /* 右側：選択した日記の表示エリア */
        .diary-viewer {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 150px;
            max-width: 400px;
        }
        .viewer-date {
            font-size: 0.75rem;
            color: #333;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        /* 普段は闇に溶けて見えないが、ドラッグ（選択）すると浮かび上がる仕掛け */
        .viewer-content {
            font-size: 1rem;
            line-height: 1.8;
            color: #0a0a0a;
            background-color: #0a0a0a;
            user-select: text;
        }
        .viewer-content::selection {
            background: #333;
            color: #fff;
        }
        .back-link {
            display: inline-block;
            margin-top: 60px;
            color: #444;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #aaa;
        }
        /* 自動挿入用の非表示エリア（JSで読み取る用） */
        .raw-posts {
            display: none;
        }
    </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M7TXH22M"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
    <div class="container">
        <h1>Diary Archive</h1>
        
        <div class="archive-layout">
            <!-- 左側：日付リスト -->
            <div class="date-list" id="dateList"></div>

            <!-- 右側：テキストビューア -->
            <div class="diary-viewer">
                <div class="viewer-date" id="viewerDate">----.--.--</div>
                <div class="viewer-content" id="viewerContent">...</div>
            </div>
        </div>

        <a href="index.html" class="back-link">&larr; return</a>
    </div>

    <!-- 自動更新プログラムが新しい日記をこの目印の直下に挿入します -->
    <div class="raw-posts" id="rawPosts">
        <!-- AUTO_ARCHIVE_START -->
        <div class="diary-post">
            <span class="diary-date">2026-09-05</span>
            <p class="secret-text">The floor is cold. I feel like staying on the floor forever.</p>
        </div>
        <div class="diary-post">
            <span class="diary-date">2026-09-04</span>
            <p class="secret-text">Ate a can of nothingness. Tasted like nothing.</p>
        </div>
    </div>

    <script>
        const postElements = document.querySelectorAll('.raw-posts .diary-post');
        const dateListEl = document.getElementById('dateList');
        const viewerDateEl = document.getElementById('viewerDate');
        const viewerContentEl = document.getElementById('viewerContent');

        const posts = [];

        postElements.forEach((el, index) => {
            const date = el.querySelector('.diary-date').textContent.trim();
            const text = el.querySelector('.secret-text').innerHTML;
            posts.push({ date, text });

            const item = document.createElement('div');
            item.className = 'date-item';
            item.textContent = date;
            
            item.addEventListener('click', () => {
                document.querySelectorAll('.date-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                viewerDateEl.textContent = date;
                viewerContentEl.innerHTML = text;
            });

            dateListEl.appendChild(item);

            if (index === 0) {
                item.classList.add('active');
                viewerDateEl.textContent = date;
                viewerContentEl.innerHTML = text;
            }
        });
    </script>
</body>
</html>
