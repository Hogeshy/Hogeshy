<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@page { size: 650px 1075px; margin:0; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#ddd; }
.card { width:650px; height:1075px; overflow:hidden; position:relative; font-family:'Courier New',monospace; }
.front { background:#111; color:#f3f0e7; text-align:center; padding-top:62px; }
.logo { width:470px; height:470px; object-fit:cover; object-position:center; border-radius:50%; display:block; margin:0 auto; }
.brand { margin-top:65px; font:76px Georgia,serif; letter-spacing:.12em; }
.tagline { margin-top:42px; font-size:27px; letter-spacing:.23em; }
.rule { width:58px; height:3px; background:#f3f0e7; margin:77px auto 0; }
.artist { margin-top:91px; font-size:23px; letter-spacing:.16em; color:#f3f0e7; }
.artist span { color:#d7cfc0; }
.back { background:#f4eedf; color:#111; text-align:center; padding-top:68px; }
.copy { margin:0 auto; width:530px; font-size:23px; line-height:1.85; letter-spacing:.08em; }
.copy strong { font-size:27px; font-weight:normal; }
.back .rule { background:#111; margin-top:53px; }
.qr { width:170px; height:170px; object-fit:cover; margin:64px auto 0; display:block; image-rendering:pixelated; }
.url { margin-top:22px; font:25px Arial,sans-serif; letter-spacing:.03em; text-decoration:underline; }
.handle { margin-top:77px; font:27px Arial,sans-serif; letter-spacing:.05em; }
.signature { position:absolute; bottom:58px; right:68px; font-family:Georgia,serif; font-size:25px; font-style:italic; }
.smallmark { display:inline-block; margin-left:8px; font-family:Arial,sans-serif; font-style:normal; font-size:25px; }
</style>
</head>
<body>
<section class="card front">
  <img class="logo" src="logo.png" alt="Hogeshy">
  <div class="brand">Hogeshy</div>
  <div class="tagline">A quiet mirror</div>
  <div class="rule"></div>
  <div class="artist"><span>yuki</span> ｜ Hogeshy</div>
</section>
<section class="card back">
  <p class="copy"><strong>頑張ることにも、癒やされることにも<br>少し疲れた猫好きのあなたへ。</strong><br><br>Hogeshyは、元気や答えをあげるのではなく、<br>ただ静かにあなたのそばにいます。</p>
  <div class="rule"></div>
  <img class="qr" src="qr.png" alt="Hogeshy公式サイトのQRコード">
  <div class="url">hogeshy.com</div>
  <div class="handle">Instagram　@hogeshy_ai</div>
  <div class="signature">yuki <span class="smallmark">◉◉</span></div>
</section>
</body>
</html>
