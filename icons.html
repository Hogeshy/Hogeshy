/* Hogeshy shared navigation: desktop map, compact menu for phones/tablets. */
.site-nav {

  display: flex;

.site-brand { color: #aaa; text-decoration: none; font-size: .72rem; letter-spacing: .18em; white-space: nowrap; }
.nav-links { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px 18px; font-size: .68rem; letter-spacing: .14em; }
.site-nav a { color: #777; text-decoration: none; transition: color .2s ease; }

.nav-toggle { display: none; appearance: none; border: 1px solid #333; background: transparent; color: #aaa; padding: 9px 12px; font: inherit; font-size: .68rem; letter-spacing: .14em; cursor: pointer; }

@media (max-width: 1023px) {

  .site-nav.is-open .nav-links { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
  .site-nav.is-open .nav-links a { display: block; padding: 11px 2px; border-bottom: 1px solid #1c1c1c; text-align: right; }
  .site-nav.is-open .nav-links a:last-child { border-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { .site-nav a { transition: none; } }

<script>
(() => {
  const nav = document.querySelector('.site-nav');
  const toggle = document.querySelector('.nav-toggle');
  if (!nav || !toggle) return;
  const close = () => {
    nav.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  };
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  nav.querySelectorAll('.nav-links a').forEach(link => link.addEventListener('click', close));
  document.addEventListener('click', event => { if (!nav.contains(event.target)) close(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
})();
</script>
