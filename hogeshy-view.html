<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hogeshyを見る｜物語・日記・無料素材</title>
  <meta name="description" content="Hogeshyの物語、日記、無料素材をご覧いただけます。">
  <meta name="theme-color" content="#efe3d2">
  <link rel="canonical" href="https://hogeshy.com/hogeshy-view.html">
  <link rel="stylesheet" href="mirror-theme.css?v=20261009-nav">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 72px;
      background: #efe3d2;
      color: #3f2e24;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container { width: min(960px, 100%); margin: 0 auto; }
    .page-header {
      max-width: 680px;
      margin: 72px auto 54px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #7a5a42;
      font: .72rem 'Courier New', monospace;
      letter-spacing: .16em;
    }
    h1 {
      margin: 0 0 24px;
      color: #3f2e24;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: .06em;
    }
    .lead {
      margin: 0;
      color: #745f50;
      font-size: 1rem;
      line-height: 2;
    }
    .view-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 0 auto;
    }
    .view-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px;
      border: 1px solid rgba(92, 64, 45, .22);
      background: rgba(255, 250, 240, .76);
      color: #3f2e24;
      text-decoration: none;
    }
    .view-card:hover,
    .view-card:focus-visible {
      background: rgba(255, 250, 240, .76);
      color: #3f2e24;
      border-color: rgba(92, 64, 45, .42);
      outline: none;
    }
    .view-number {
      color: #7f9365;
      font: .72rem 'Courier New', monospace;
      letter-spacing: .14em;
    }
    .view-card h2 {
      margin: 28px 0 12px;
      color: #3f2e24;
      font-size: 1.25rem;
      font-weight: 400;
    }
    .view-card p {
      margin: 0;
      color: #745f50;
      font-size: .92rem;
      line-height: 1.9;
    }
    .view-link {
      display: block;
      margin-top: 28px;
      color: #7a5a42;
      font-size: .8rem;
      letter-spacing: .08em;
    }
    .back-link {
      display: block;
      width: fit-content;
      margin: 48px auto 0;
    }
    @media (max-width: 720px) {
      body { padding: 22px 16px 52px; }
      .page-header { margin: 54px auto 38px; }
      .lead { font-size: .92rem; }
      .view-grid { grid-template-columns: 1fr; gap: 12px; }
      .view-card { min-height: 0; padding: 24px 22px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="site-nav" aria-label="主要メニュー"></nav>

    <header class="page-header">
      <p class="eyebrow">Hogeshy</p>
      <h1>Hogeshyを見る</h1>
      <p class="lead">物語や日記、無料でお持ち帰りいただけるものをまとめています。<br>気になるところから、ゆっくりご覧ください。</p>
    </header>

    <section class="view-grid" aria-label="Hogeshyのコンテンツ">
      <a class="view-card" href="story.html">
        <div>
          <span class="view-number">01 / 物語</span>
          <h2>物語</h2>
          <p>Hogeshyが過ごす、静かな短い物語です。</p>
        </div>
        <span class="view-link">物語を見る →</span>
      </a>
      <a class="view-card" href="diaryarchive.html">
        <div>
          <span class="view-number">02 / 日記</span>
          <h2>日記</h2>
          <p>頑張ることにも、癒されることにも少し疲れたHogeshyの日記です。</p>
        </div>
        <span class="view-link">日記を読む →</span>
      </a>
      <a class="view-card" href="free.html">
        <div>
          <span class="view-number">03 / 無料コンテンツ</span>
          <h2>無料コンテンツ</h2>
          <p>壁紙やアイコン、漫画など、気に入ったものをお楽しみいただけます。</p>
        </div>
        <span class="view-link">無料素材を見る →</span>
      </a>
    </section>

    <a class="back-link" href="index.html">← ホームへ戻る</a>
  </main>
  <script src="shared-nav.js?v=20261009-content-hub"></script>
</body>
</html>
