name: Update Hogeshy Diary

on:
  schedule:
    # 毎日 日本時間の朝9:00（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate diary
        id: diary
        run: node update_diary.js

      - name: Notify diary subscribers
        if: steps.diary.outputs.diary_updated == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '2'
          BREVO_SENDER_EMAIL: info@hogeshy.com
          BREVO_SENDER_NAME: Hogeshy
        run: node send_diary_email.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-generate daily diary [skip ci]'
          branch: main
