name: Auto Update Diary

on:
  schedule:
    - cron: '5 0 * * *' # 毎日UTC 0:05（日本時間 9:05）に実行
  workflow_dispatch: # GitHubの画面から手動でも実行できるようにする

jobs:
  update-diary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run script to add diary
        run: node update_diary.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add diary.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate diary for today" && git push)
