<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogeshy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* overflow: hidden; を削除し、縦方向のみスクロールを許可 */
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            transition: background-color 1s ease;
            /* スマホで上下に余裕を持たせるためのパディング */
            padding: 40px 0;
        }

        /* 深夜帯（0時〜4時）の変貌クラス */
        body.midnight-mode {
            background-color: #0b0202;
            color: #e0bcbc;
        }

        body.midnight-mode .ambient-control {
            border-color: #511;
            color: #c88;
        }

        body.midnight-mode h1 {
            color: #ffcccc;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        body.midnight-mode .image-wrapper {
            border-color: #411;
            box-shadow: 0 0 35px rgba(100, 0, 0, 0.7);
        }

        body.midnight-mode .btn {
            border-color: #411;
            color: #c99;
        }

        body.midnight-mode .btn:hover {
            background: #ffcccc;
            color: #000;
            border-color: #ffcccc;
        }

        /* グリッチ演出 */
        @keyframes glitchFlash {
            0% { opacity: 1; filter: none; }
            10% { opacity: 0.3; filter: invert(80%) hue-rotate(90deg); transform: translateX(-2px); }
            20% { opacity: 1; filter: none; transform: translateX(2px); }
            30% { opacity: 0.6; filter: blur(2px); }
            50% { opacity: 1; filter: none; }
            100% { opacity: 1; filter: none; }
        }

        body.midnight-mode.glitching {
            animation: glitchFlash 0.6s steps(2, start) forwards;
        }

        /* 赤い猫の足跡（深夜モード時のみ出現） */
        .paw-print {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: rgba(200, 10, 10, 0.75);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: pawFade 4s ease forwards;
            z-index: 10;
        }

        .paw-print::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 2px;
            width: 9px;
            height: 7px;
            background-color: inherit;
            border-radius: 50%;
            box-shadow: -4px 5px 0 inherit, 4px 5px 0 inherit;
        }

        @keyframes pawFade {
            0% { opacity: 0.85; transform: scale(0.8); }
            30% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(1.15); }
        }

        /* 環境音スイッチ */
        .ambient-control {
            position: fixed; /* absoluteからfixedに変えて、スクロールしても常に見えるように */
            top: 20px;
            right: 20px;
            font-size: 0.65rem;
            color: #555;
            background: rgba(5, 5, 5, 0.8);
            border: 1px solid #222;
            padding: 6px 10px;
            cursor: pointer;
            letter-spacing: 0.15em;
            transition: all 0.3s;
            z-index: 20;
        }

        .ambient-control:hover {
            color: #fff;
            border-color: #666;
        }

        .container {
            text-align: center;
            max-width: 440px;
            padding: 20px;
            width: 100%;
            z-index: 20;
        }

        @keyframes strangeAppear {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
                filter: blur(6px);
            }
            40% {
                opacity: 0.4;
                transform: translateY(-3px) scale(1.01);
                filter: blur(2px);
            }
            70% {
                opacity: 0.8;
                transform: translateY(1px) scale(1);
                filter: blur(0.5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .image-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(120%);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #fff;
            margin-bottom: 12px;
            text-transform: uppercase;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
            opacity: 0;
        }

        .flavor-text {
            font-size: 0.8rem;
            color: #777;
            line-height: 1.7;
            margin-bottom: 28px;
            letter-spacing: 0.05em;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
        }

        .btn {
            display: block;
            padding: 12px 0;
            background: transparent;
            color: #ccc;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn.disabled {
            color: #444;
            border-color: #1a1a1a;
            cursor: default;
            pointer-events: none;
        }

        .guestbook {
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
            font-size: 0.7rem;
            color: #555;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
        }

        .guestbook input {
            background: #0a0a0a;
            border: 1px solid #222;
            color: #aaa;
            padding: 6px;
            font-family: inherit;
            font-size: 0.7rem;
            width: 70%;
            margin-right: 5px;
            outline: none;
        }

        .guestbook button {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .guestbook button:hover {
            color: #fff;
            border-color: #666;
        }

        .log-list {
            margin-top: 10px;
            color: #444;
            font-size: 0.65rem;
            min-height: 20px;
            letter-spacing: 0.1em;
            transition: filter 0.5s ease;
        }

        .copyright {
            margin-top: 20px;
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <button class="ambient-control" id="sound-btn">SOUND: OFF</button>

    <div class="container">
        <div class="image-wrapper" id="easter-egg-target" title="...?">
            <img src="Hogeshy.png" alt="Hogeshy">
        </div>

        <h1 id="site-title">Hogeshy</h1>
        <div class="flavor-text" id="flavor-text">
            Hoge × Munashy = Hogeshy<br>
            Eats nothingness, eats canned cat food, and thinks about nothing.<br>
            But, probably happy.
        </div>

        <div class="links">
            <a href="wallpapers.html" class="btn">WALLPAPERS</a>
            <a href="icons.html" class="btn">ICONS</a>
            <a href="gallery.html" class="btn">GALLERY</a>
            <a href="#" class="btn disabled">LINE STAMP (COMING SOON)</a>
            <a href="https://www.instagram.com/hogeshy_ai/" class="btn" target="_blank">INSTAGRAM</a>
        </div>

        <div class="guestbook">
            <div style="margin-bottom: 6px; letter-spacing: 0.1em;" id="trace-label">Leave a trace...</div>
            <form id="trace-form">
                <input type="text" id="trace-input" placeholder="..." maxlength="20" autocomplete="off">
                <button type="submit">SEND</button>
            </form>
            <div class="log-list" id="log-list">...</div>
            <div class="copyright" id="copyright-text">&copy; Hogeshy</div>
        </div>
    </div>

    <script>
        // --- 深夜変貌モードの判定 (0時〜4時) ---
        const currentHour = new Date().getHours();
        const isMidnight = currentHour >= 0 && currentHour < 4;

        if (isMidnight) {
            document.body.classList.add('midnight-mode');
            
            const titles = ["Hogeshy [3:03 AM]", "Hogeshy [WITCHING HOUR]", "Hog...sh..."];
            document.getElementById('site-title').textContent = titles[Math.floor(Math.random() * titles.length)];
            document.getElementById('copyright-text').textContent = "© Hogeshy // THE VEIL IS THIN";

            window.addEventListener('load', () => {
                setTimeout(() => {
                    document.body.classList.add('glitching');
                }, 800);

                setTimeout(spawnMassivePawPrints, 1200);
                setTimeout(spawnMassivePawPrints, 3200);
            });
        }

        function spawnMassivePawPrints() {
            for (let route = 0; route < 3; route++) {
                setTimeout(() => {
                    let x = Math.random() * (window.innerWidth - 200) + 100;
                    let y = Math.random() * (window.innerHeight - 200) + 100;

                    for (let i = 0; i < 12; i++) {
                        setTimeout(() => {
                            const paw = document.createElement('div');
                            paw.className = 'paw-print';
                            
                            x += (Math.random() * 120 - 60);
                            y += (Math.random() * 90 - 45);

                            if (x < 10) x = 30;
                            if (x > window.innerWidth - 10) x = window.innerWidth - 30;
                            if (y < 10) y = 30;
                            if (y > window.innerHeight - 10) y = window.innerHeight - 30;

                            paw.style.left = x + 'px';
                            paw.style.top = y + 'px';
                            document.body.appendChild(paw);
                            
                            setTimeout(() => paw.remove(), 4500);
                        }, i * 120);
                    }
                }, route * 600);
            }
        }

        // --- ブラウザブロックを完全突破するサウンドシステム ---
        let audioCtx = null;
        let noiseSource = null;
        let isPlaying = false;
        const soundBtn = document.getElementById('sound-btn');

        function playNoise() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (noiseSource) {
                try { noiseSource.stop(); } catch(e) {}
                noiseSource = null;
            }

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = isMidnight ? 200 : 350;

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.15;

            noiseSource.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseSource.start();
            isPlaying = true;

            soundBtn.textContent = "SOUND: ON";
            soundBtn.style.borderColor = isMidnight ? "#511" : "#666";
            soundBtn.style.color = isMidnight ? "#c88" : "#fff";
        }

        function stopNoise() {
            if (noiseSource) {
                try { noiseSource.stop(); } catch(e) {}
                noiseSource = null;
            }
            isPlaying = false;

            soundBtn.textContent = "SOUND: OFF";
            soundBtn.style.borderColor = "#222";
            soundBtn.style.color = "#555";
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                stopNoise();
            } else {
                playNoise();
            }
        });

        // --- イースターエッグ ---
        let clickCount = 0;
        const targetImg = document.getElementById('easter-egg-target');
        const flavorText = document.getElementById('flavor-text');

        targetImg.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 5) {
                flavorText.style.color = isMidnight ? "#ff9999" : "#fff";
                flavorText.innerHTML = 
                    "ACCESS DETECTED.<br>Coordinates: 33.8833° N, 130.8833° E<br>" + 
                    (isMidnight ? "WITCHING HOUR ACTIVE. DO NOT LOOK BEHIND YOU." : "Everything is transient.");
                setTimeout(() => {
                    clickCount = 0;
                }, 6000);
            }
        });

        // --- ランダム足跡（ゲストブック） ---
        const traceForm = document.getElementById('trace-form');
        const traceInput = document.getElementById('trace-input');
        const logList = document.getElementById('log-list');

        const normalTraces = [
            "Midnight echo...", "Nothing here.", "Cold floor.", 
            "A cat meowed somewhere.", "Just passing through.",
            "Darkness is quiet.", "Can't sleep.", "Where is this?",
            "Staring at the screen.", "Void."
        ];

        const midnightTraces = [
            "Why are you awake?", "The world has stopped.", 
            "Something is watching...", "3:14 AM. The dark deep.", 
            "Don't look behind you.", "Empty room, empty mind.",
            "The hour of shadows.", "They know you are here."
        ];

        const activeTraces = isMidnight ? midnightTraces : normalTraces;
        let currentTrace = activeTraces[Math.floor(Math.random() * activeTraces.length)] ?? activeTrops[0];
        logList.textContent = `> "${currentTrace}"`;

        traceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = traceInput.value.trim();
            if (val) {
                logList.textContent = `> "${val}"`;
                traceInput.value = "";

                if (isMidnight) {
                    logList.style.filter = "blur(0px)";
                    let blurVal = 0;
                    const fadeOutInterval = setInterval(() => {
                        blurVal += 0.2;
                        logList.style.filter = `blur(${blurVal}px)`;
                        if (blurVal > 4) {
                            clearInterval(fadeOutInterval);
                            setTimeout(() => {
                                logList.textContent = `> "..."`;
                                logList.style.filter = "blurpx)";
                            }, 1500);
                        }
                    }, 200);
                }
            }
        });
    </script>

</body>
</html>
