<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogeshy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 440px;
            padding: 20px;
            width: 100%;
        }

        .image-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(120%);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #fff;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .flavor-text {
            font-size: 0.8rem;
            color: #777;
            line-height: 1.7;
            margin-bottom: 28px;
            letter-spacing: 0.05em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 0;
            background: transparent;
            color: #ccc;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* ギャラリー（一覧）セクション用の簡易スタイル */
        .gallery-section {
            display: none; /* 初期状態は非表示（ボタンやページ切り替えで出す用） */
            margin-top: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .grid img {
            width: 100%;
            border: 1px solid #222;
            display: block;
        }

        .back-btn {
            font-size: 0.75rem;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            color: #888;
            margin-top: 10px;
        }
        .back-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container" id="main-view">
        <div class="image-wrapper">
            <img src="Hogeshy.png" alt="Hogeshy">
        </div>

        <h1>Hogeshy</h1>
        <div class="flavor-text">
            Hoge × Munashy = Hogeshy<br>
            Eats nothingness, eats canned cat food, and thinks about nothing.<br>
            But, probably happy.
        </div>

        <div class="links">
            <a href="wallpapers.html" class="btn">WALLPAPERS</a>
            <a href="icons.html" class="btn">ICONS</a>
            <a href="https://www.instagram.com/hogeshy_ai/" class="btn" target="_blank">INSTAGRAM</a>
        </div>
    </div>

</body>
</html>
