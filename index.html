<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogeshy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            transition: background-color 1s ease;
            -webkit-user-select: none;
            user-select: none;
            padding: 40px 0;
        }

        /* 深夜帯（0時〜4時）の変貌クラス */
        body.midnight-mode {
            background-color: #0b0202;
            color: #e0bcbc;
        }

        body.midnight-mode h1 {
            color: #ffcccc;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        body.midnight-mode .image-wrapper {
            border-color: #411;
            box-shadow: 0 0 35px rgba(100, 0, 0, 0.7);
        }

        body.midnight-mode .btn {
            border-color: #411;
            color: #c99;
        }

        body.midnight-mode .btn:hover {
            background: #ffcccc;
            color: #000;
            border-color: #ffcccc;
        }

        /* グリッチ演出（全体） */
        @keyframes glitchFlash {
            0% { opacity: 1; filter: none; }
            10% { opacity: 0.3; filter: invert(80%) hue-rotate(90deg); transform: translateX(-2px); }
            20% { opacity: 1; filter: none; transform: translateX(2px); }
            30% { opacity: 0.6; filter: blur(2px); }
            50% { opacity: 1; filter: none; }
            100% { opacity: 1; filter: none; }
        }

        body.midnight-mode.glitching {
            animation: glitchFlash 0.6s steps(2, start) forwards;
        }

        /* タイトルのランダム・テキストグリッチ */
        @keyframes textGlitch {
            0% { transform: translate(0); filter: none; }
            20% { transform: translate(-1px, 1px); filter: contrast(200%); }
            40% { transform: translate(-2px, -1px); filter: blur(0.5px); }
            60% { transform: translate(1px, 1px); filter: none; }
            80% { transform: translate(1px, -1px); filter: invert(20%); }
            100% { transform: translate(0); filter: none; }
        }

        .glitch-text {
            display: inline-block;
        }

        .glitching-active {
            animation: textGlitch 0.2s steps(2, start) infinite;
            color: #ff4444 !important;
        }

        /* 赤い猫の足跡（深夜モード時のみ自動出現） */
        .paw-print {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: rgba(200, 10, 10, 0.75);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: pawFade 4s ease forwards;
            z-index: 10;
        }

        .paw-print::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 2px;
            width: 9px;
            height: 7px;
            background-color: inherit;
            border-radius: 50%;
            box-shadow: -4px 5px 0 inherit, 4px 5px 0 inherit;
        }

        @keyframes pawFade {
            0% { opacity: 0.85; transform: scale(0.8); }
            30% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(1.15); }
        }

        /* タップ・マウス軌跡のノイズ粒子 */
        .touch-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(180, 180, 180, 0.6);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: particleFade 0.8s ease-out forwards;
            z-index: 99;
        }

        body.midnight-mode .touch-particle {
            background-color: rgba(200, 30, 30, 0.7);
            box-shadow: 0 0 6px rgba(255, 0, 0, 0.8);
        }

        @keyframes particleFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.5); }
        }

        .container {
            text-align: center;
            max-width: 440px;
            padding: 20px;
            width: 100%;
            z-index: 20;
            margin: auto;
        }

        @keyframes strangeAppear {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
                filter: blur(6px);
            }
            40% {
                opacity: 0.4;
                transform: translateY(-3px) scale(1.01);
                filter: blur(2px);
            }
            70% {
                opacity: 0.8;
                transform: translateY(1px) scale(1);
                filter: blur(0.5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .image-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(120%);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #fff;
            margin-bottom: 12px;
            text-transform: uppercase;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
            opacity: 0;
        }

        .flavor-text {
            font-size: 0.8rem;
            color: #777;
            line-height: 1.7;
            margin-bottom: 28px;
            letter-spacing: 0.05em;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
        }

        /* 日記セクションのスタイル */
        .diary-container {
            margin-bottom: 2px;
        }

        .diary-post {
            padding: 10px 0;
            border: 1px solid #1a1a1a;
            background: rgba(10, 10, 10, 0.5);
            text-align: center;
        }

        .diary-header {
            font-size: 0.65rem;
            color: #777;
            letter-spacing: 0.2em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .diary-date {
            font-size: 0.65rem;
            color: #555;
            letter-spacing: 0.15em;
        }

        .secret-text {
            font-size: 0.75rem;
            color: #050505; /* 背景と同化させて一見白紙に見せる */
            user-select: text;
            -webkit-user-select: text;
            transition: color 0.3s;
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        /* マウスでドラッグして選択した瞬間だけ文字が浮かび上がる */
        .secret-text::selection {
            background-color: #ff4444;
            color: #000000;
        }

        .btn {
            display: block;
            padding: 12px 0;
            background: transparent;
            color: #ccc;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn.disabled {
            color: #444;
            border-color: #1a1a1a;
            cursor: default;
            pointer-events: none;
        }

        .guestbook {
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
            font-size: 0.7rem;
            color: #555;
            opacity: 0;
            animation: strangeAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
        }

        .guestbook form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .guestbook input {
            background: #0a0a0a;
            border: 1px solid #222;
            color: #aaa;
            padding: 8px;
            font-family: inherit;
            font-size: 0.75rem;
            width: 72%;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .guestbook input:focus {
            border-color: #555;
            color: #fff;
        }

        .guestbook button {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .guestbook button:hover {
            color: #fff;
            border-color: #666;
        }

        .log-list {
            margin-top: 10px;
            color: #444;
            font-size: 0.65rem;
            min-height: 20px;
            letter-spacing: 0.1em;
            transition: filter 0.5s ease;
        }

        .copyright {
            margin-top: 20px;
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-wrapper" id="easter-egg-target" title="...?">
            <img src="Hogeshy.png" alt="Hogeshy">
        </div>

        <h1 id="site-title"><span class="glitch-text" id="title-text">Hogeshy</span></h1>
        <div class="flavor-text" id="flavor-text">
            Hoge × Munashy = Hogeshy<br>
            Eats nothingness, eats canned cat food, and thinks about nothing.<br>
            But, probably happy.
        </div>

       <div class="links">
    <a href="diary.html" class="btn">DIARY ARCHIVE</a>
     <a href="thefirsttendays.html" class="btn">THE FIRST TWENTY DAYS</a>   
    <a href="wallpapers.html" class="btn">WALLPAPERS</a>
    <a href="icons.html" class="btn">ICONS</a>
    <a href="gallery.html" class="btn">GALLERY</a>
    <a href="#" class="btn disabled">LINE STICKERS — COMING SOON</a>
    <a href="https://www.instagram.com/hogeshy_ai/" class="btn" target="_blank">INSTAGRAM</a>
</div>

        <div class="guestbook">
            <div style="margin-bottom: 6px; letter-spacing: 0.1em;" id="trace-label">Leave a trace...</div>
            <form id="trace-form">
                <input type="text" id="trace-input" placeholder="..." maxlength="20" autocomplete="off">
                <button type="submit">SEND</button>
            </form>
            <div class="log-list" id="log-list">...</div>
            <div class="copyright" id="copyright-text">&copy; Hogeshy</div>
        </div>
    </div>

    <script>
        // --- 深夜変貌モードの判定 (0時〜4時) ---
        const currentHour = new Date().getHours();
        const isMidnight = currentHour >= 0 && currentHour < 4;

        if (isMidnight) {
            document.body.classList.add('midnight-mode');
            
            const titles = ["Hogeshy [3:03 AM]", "Hogeshy [WITCHING HOUR]", "Hog...sh..."];
            document.getElementById('title-text').textContent = titles[Math.floor(Math.random() * titles.length)];
            document.getElementById('copyright-text').textContent = "© Hogeshy // THE VEIL IS THIN";

            window.addEventListener('load', () => {
                setTimeout(() => {
                    document.body.classList.add('glitching');
                }, 800);

                setTimeout(spawnMassivePawPrints, 1200);
                setTimeout(spawnMassivePawPrints, 3200);
            });
        }

        // --- 1. ランダム・テキストグリッチ（不意に文字が歪む） ---
        const titleSpan = document.getElementById('title-text');
        const originalTitleText = titleSpan.textContent;

        function triggerTextGlitch() {
            const glitchChars = ['#', '3', '%', 'x', '7', '_', 'sh', '0', '~'];
            if (Math.random() > 0.4) {
                titleSpan.classList.add('glitching-active');
                if (Math.random() > 0.5) {
                    titleSpan.textContent = "H0g3sh" + glitchChars[Math.floor(Math.random() * glitchChars.length)];
                }
                setTimeout(() => {
                    titleSpan.classList.remove('glitching-active');
                    titleSpan.textContent = originalTitleText;
                }, Math.random() * 250 + 100);
            }
            setTimeout(triggerTextGlitch, Math.random() * 4000 + 2000);
        }
        setTimeout(triggerTextGlitch, 2000);


        // --- 2. タップ・マウス軌跡のノイズ粒子（スマホ・iPad・PC完全対応） ---
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'touch-particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.7) {
                createParticle(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch && Math.random() > 0.5) {
                createParticle(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch) {
                for (let i = 0; i < 2; i++) {
                    createParticle(touch.clientX + (Math.random() * 20 - 10), touch.clientY + (Math.random() * 20 - 10));
                }
            }
        }, { passive: true });


        function spawnMassivePawPrints() {
            for (let route = 0; route < 3; route++) {
                setTimeout(() => {
                    let x = Math.random() * (window.innerWidth - 200) + 100;
                    let y = Math.random() * (window.innerHeight - 200) + 100;

                    for (let i = 0; i < 12; i++) {
                        setTimeout(() => {
                            const paw = document.createElement('div');
                            paw.className = 'paw-print';
                            
                            x += (Math.random() * 120 - 60);
                            y += (Math.random() * 90 - 45);

                            if (x < 10) x = 30;
                            if (x > window.innerWidth - 10) x = window.innerWidth - 30;
                            if (y < 10) y = 30;
                            if (y > window.innerHeight - 10) y = window.innerHeight - 30;

                            paw.style.left = x + 'px';
                            paw.style.top = y + 'px';
                            document.body.appendChild(paw);
                            
                            setTimeout(() => paw.remove(), 4500);
                        }, i * 120);
                    }
                }, route * 600);
            }
        }

        // --- イースターエッグ ---
        let clickCount = 0;
        const targetImg = document.getElementById('easter-egg-target');
        const flavorText = document.getElementById('flavor-text');

        targetImg.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 5) {
                flavorText.style.color = isMidnight ? "#ff9999" : "#fff";
                flavorText.innerHTML = 
                    "ACCESS DETECTED.<br>Coordinates: 33.8833° N, 130.8833° E<br>" + 
                    (isMidnight ? "WITCHING HOUR ACTIVE. DO NOT LOOK BEHIND YOU." : "Everything is transient.");
                setTimeout(() => {
                    clickCount = 0;
                }, 6000);
            }
        });

        // --- ランダム足跡（ゲストブック） ---
        const traceForm = document.getElementById('trace-form');
        const traceInput = document.getElementById('trace-input');
        const logList = document.getElementById('log-list');

        const normalTraces = [
            "Midnight echo...", "Nothing here.", "Cold floor.", 
            "A cat meowed somewhere.", "Just passing through.",
            "Darkness is quiet.", "Can't sleep.", "Where is this?",
            "Staring at the screen.", "Void."
        ];

        const midnightTraces = [
            "Why are you awake?", "The world has stopped.", 
            "Something is watching...", "3:14 AM. The deep dark.", 
            "Don't look behind you.", "Empty room, empty mind.",
            "The hour of shadows.", "They know you are here."
        ];

        const activeTraces = isMidnight ? midnightTraces : normalTraces;
        let currentTrace = activeTraces[Math.floor(Math.random() * activeTraces.length)] ?? activeTraces[0];
        logList.textContent = `> "${currentTrace}"`;

        traceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = traceInput.value.trim();
            if (val) {
                logList.textContent = `> "${val}"`;
                traceInput.value = "";

                if (isMidnight) {
                    logList.style.filter = "blur(0px)";
                    let blurVal = 0;
                    const fadeOutInterval = setInterval(() => {
                        blurVal += 0.2;
                        logList.style.filter = `blur(${blurVal}px)`;
                        if (blurVal > 4) {
                            clearInterval(fadeOutInterval);
                            setTimeout(() => {
                                logList.textContent = `> "..."`;
                                logList.style.filter = "blur(0px)";
                            }, 1500);
                        }
                    }, 200);
                }
            }
        });
    </script>

</body>
</html>
