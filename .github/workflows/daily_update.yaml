name: Daily Hogeshy Archive Update

on:
  schedule:
    - cron: '0 15 * * *' # 日本時間 0:00 (UTC 15:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update_diary.js

      - name: Commit and push changes
        run: |
          git config --global user.name "Hogeshy Bot"
          git config --global user.email "bot@hogeshy.local"
          git add diary.html
          git commit -m "Auto-add new surreal diary to archive [skip ci]" || exit 0
          git push
