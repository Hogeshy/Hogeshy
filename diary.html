<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogeshy Diary Archive</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #161616;
            border: 1px solid #333;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
            color: #aaa;
        }
        .archive-layout {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        /* 左側：縦スクロールする日付リスト */
        .date-list {
            flex: 1;
            max-height: 400px;
            overflow-y: auto;
            border-right: 1px solid #222;
            padding-right: 15px;
        }
        .date-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px dashed #222;
            transition: background 0.2s, color 0.2s;
            font-size: 0.9rem;
        }
        .date-item:hover, .date-item.active {
            background: #222;
            color: #fff;
            padding-left: 15px;
        }
        /* 右側：選んだ日記の内容が表示される場所 */
        .diary-viewer {
            flex: 2;
            background: #111;
            padding: 20px;
            border: 1px solid #222;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .viewer-date {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 10px;
        }
        /* 普段は黒に馴染んで見えないが、マウスで選択（ドラッグ）すると浮かび上がる仕掛け */
        .viewer-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #111;
            background-color: #111;
            user-select: text;
            transition: color 0.3s ease;
        }
        /* ドラッグしている最中や、マウスを乗せたときにうっすら見える演出（または選択で浮き出る） */
        .viewer-content::selection {
            background: #333;
            color: #fff;
        }
        .viewer-content:hover {
            color: #222; /* ホバーするだけでは見えにくく、ドラッグ（選択）すると読める */
        }
        .hint {
            font-size: 0.75rem;
            color: #444;
            margin-top: 15px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-link:hover {
            color: #fff;
        }
        /* 自動挿入用の非表示エリア（JSで読み取る用） */
        .raw-posts {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DIARY ARCHIVE</h1>
        
        <div class="archive-layout">
            <div class="date-list" id="dateList"></div>
            <div class="diary-viewer">
                <div>
                    <div class="viewer-date" id="viewerDate">日付を選んでください</div>
                    <div class="viewer-content" id="viewerContent">ここにその日の記録が浮かび上がります。</div>
                    <!--<div class="hint">※ ドラッグして選択すると文字が浮かび上がります</div>-->
                </div>
            </div>
        </div>

        <a href="index.html" class="back-link">← TOPに戻る</a>
    </div>

    <!-- 自動更新プログラムが新しい日記をこの目印の直下に挿入します -->
    <div class="raw-posts" id="rawPosts">
        <!-- AUTO_ARCHIVE_START -->
        <div class="diary-post">
            <span class="diary-date">2026-09-05</span>
            <p class="secret-text">床が冷たい。ずっと床でいい気がする。</p>
        </div>
        <div class="diary-post">
            <span class="diary-date">2026-09-04</span>
            <p class="secret-text">虚無味の缶詰を食べた。味がしなかった。</p>
        </div>
    </div>

    <script>
        const postElements = document.querySelectorAll('.raw-posts .diary-post');
        const dateListEl = document.getElementById('dateList');
        const viewerDateEl = document.getElementById('viewerDate');
        const viewerContentEl = document.getElementById('viewerContent');

        const posts = [];

        postElements.forEach((el, index) => {
            const date = el.querySelector('.diary-date').textContent.trim();
            const text = el.querySelector('.secret-text').innerHTML;
            posts.push({ date, text });

            const item = document.createElement('div');
            item.className = 'date-item';
            item.textContent = date;
            
            item.addEventListener('click', () => {
                document.querySelectorAll('.date-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                viewerDateEl.textContent = date;
                viewerContentEl.innerHTML = text;
            });

            dateListEl.appendChild(item);

            if (index === 0) {
                item.classList.add('active');
                viewerDateEl.textContent = date;
                viewerContentEl.innerHTML = text;
            }
        });
    </script>
</body>
</html>
